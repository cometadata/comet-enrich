[package]
name = "comet-enrich-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Developer utilities; never installed (the installer copies only
# the comet-enrich binary). Kept in the workspace so `cargo run -p ...` works.
publish = false

[[bin]]
name = "tools"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
comet-enrich-core = { workspace = true }
futures = "0.3"
log = { workspace = true }
reqwest = { workspace = true }
rlimit = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
simple_logger = "5"
time = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
comet-enrich-test-support = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
